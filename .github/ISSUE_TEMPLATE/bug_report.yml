name: Bug report
description: Report a reproducible defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please search the existing issues first.

        ⚠️ **Privacy**: do not paste real session contents, tokens or secrets.
        Redact paths, usernames and project names. Security issues must go through the
        private channel described in [SECURITY.md](../blob/main/SECURITY.md) - not a
        public issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
      placeholder: "Example: `--by-day --until 20260912` drops the 12th from the table."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands (with all relevant flags) and the input characteristics involved
      placeholder: |
        1. Run `codex-usage --by-model --since 20260901`
        2. Observe ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Actual output / error
      description: Paste stdout and stderr (redact anything sensitive)
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: codex-usage version
      description: From the first line of `codex-usage --doctor`, or `python -m pip show codex-usage`
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version and install method
      placeholder: "3.12.13; uv tool install / pip install -e . / running from source"
    validations:
      required: true

  - type: input
    id: os-terminal
    attributes:
      label: OS and terminal
      placeholder: "Linux Fedora 41 / kitty 0.42; mention tmux, SSH or output redirection"
    validations:
      required: true

  - type: dropdown
    id: image-extras
    attributes:
      label: Is the `[image]` extra installed?
      options:
        - "No (base install only, ASCII charts)"
        - "Yes (matplotlib + textual-image)"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `codex-usage --doctor`
      description: Please include this for environment-related issues (it prints data sources, pricing and chart mode; redact paths)
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: I searched the existing issues and found no duplicate
          required: true
        - label: What I pasted contains no real session data, tokens or other sensitive information
          required: true
