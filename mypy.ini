; mypy configuration - deliberately non-strict: make type checking runnable and its
; baseline measurable first, then tighten step by step.
;
; Roadmap: clear the baseline -> enable check_untyped_defs (also check unannotated
; function bodies) -> move module by module towards strict. Until the baseline is clean,
; the CI lint job stays continue-on-error.

[mypy]
; Check the library only (tests are not part of the type gate yet).
files = src
exclude = (?x)(^\.scratch/|^build/|^dist/)

; Aligned with requires-python = ">=3.10" in pyproject.toml (3.10 is the floor).
python_version = 3.10

; rich / plotext / termcharts / matplotlib / textual_image ship no type information.
; Ignoring them here keeps third-party noise from drowning real findings.
ignore_missing_imports = True

; Keep CI logs readable and greppable.
show_error_codes = True
show_column_numbers = True
pretty = False

; Report unknown or renamed options instead of silently ignoring them.
warn_unused_configs = True

; Non-strict options worth enabling later:
; check_untyped_defs = True
; no_implicit_optional = True
