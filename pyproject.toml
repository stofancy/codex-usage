[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-usage"
# 未做过正式发布，开源首发从 0.x 起步：允许在 1.0 之前做破坏性调整
version = "0.2.1"
description = "Local Codex usage analytics: token and cost breakdown by session, subagent, day and model, with terminal charts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "stofancy" }]
keywords = ["codex", "openai", "usage", "terminal", "cli", "token", "cost", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "rich>=13.0",
    "plotext==5.2.8",
    "termcharts>=1.1.2",
]

[project.optional-dependencies]
# 图表真图渲染：支持图形协议的终端显示 PNG，其余自动落回半块/字符画
image = [
    "matplotlib>=3.8",
    "textual-image>=0.13; python_version >= '3.12'",
]

[project.urls]
Homepage = "https://github.com/stofancy/codex-usage"
Repository = "https://github.com/stofancy/codex-usage"
Issues = "https://github.com/stofancy/codex-usage/issues"
Changelog = "https://github.com/stofancy/codex-usage/blob/main/CHANGELOG.md"

[project.scripts]
codex-usage = "codex_usage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_usage"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "docs",
    "tools",
    "README.md",
    "README.zh-CN.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
