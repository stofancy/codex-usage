[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-usage"
version = "1.0.0"
description = "Codex 本地用量统计：按会话/子代理/天/模型聚合，终端表格与图表"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "stofancy" }]
keywords = ["codex", "openai", "usage", "terminal", "cli", "token", "cost"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "rich>=13.0",
    "plotext==5.2.8",
    "termcharts>=1.1.2",
]

[project.optional-dependencies]
# 图表真图渲染：支持图形协议的终端显示 PNG，其余自动落回半块/字符画
image = [
    "matplotlib>=3.8",
    "textual-image>=0.13; python_version >= '3.12'",
]

[project.urls]
Homepage = "https://github.com/stofancy/codex-usage"

[project.scripts]
codex-usage = "codex_usage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_usage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
