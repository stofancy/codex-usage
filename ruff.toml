# ruff configuration - starts from a conservative ruleset: correctness checks only,
# no formatter enforcement.
#
# Ruleset:
#   E4 / E7 / E9   pycodestyle: import placement, statement and syntax checks
#   F              pyflakes: unused imports/variables, undefined names, redefinitions
#   I              isort (NOT enabled yet): enabling it would immediately flag import
#                  ordering in four files (src/codex_usage/parser.py,
#                  src/codex_usage/render/tables.py, tests/test_stats.py,
#                  tools/make_doc_shots.py). Sort those imports first, then add "I".
#
# Baseline: with the current selection the existing tree has ~13 findings
#           (src 2 / tests 9 / tools 2); the list lives in CONTRIBUTING.md
#           ("Quality gates and the known baseline"). Once the baseline is clean, drop
#           continue-on-error from the CI lint job to turn it into a real gate.

# Matches the existing style: ~99.4% of 3903 lines fit within 100 columns (longest: 117).
line-length = 100

# Lowest supported Python, aligned with requires-python = ">=3.10" in pyproject.toml.
target-version = "py310"

exclude = [
    ".git",
    ".venv",
    ".scratch",
    ".dsh-*",
    ".ruff_cache",
    ".mypy_cache",
    ".pytest_cache",
    "build",
    "dist",
    "__pycache__",
    "*.egg-info",
]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.isort]
# Used once the isort rules are enabled (add "I" to select).
known-first-party = ["codex_usage"]
